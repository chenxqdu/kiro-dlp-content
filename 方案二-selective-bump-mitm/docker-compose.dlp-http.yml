# Kiro DLP 判定薄 HTTP 服务 —— 复用现有镜像 kiro-dlp-engine:latest（load+up，不 pull/push）
#
# 部署位置：DLP 主机 <TEST_INSTANCE_ID> (us-west-2, 172.31.27.174) 的
#           /home/ec2-user/kiro-dlp/docker-compose.dlp-http.yml
# 启动：cd /home/ec2-user/kiro-dlp && docker compose -f docker-compose.dlp-http.yml up -d
#
# ★ 已核实事实（勿改）：
#   - 镜像 WORKDIR=/app，Env 内建 PYTHONPATH=/app、PRESIDIO_ANALYZER_URL=http://presidio-analyzer:5002/analyze
#   - 镜像 Entrypoint=null（已核实）、Cmd=["python","-m","tests.run_offline","--no-color"]。
#     ★ ENTRYPOINT 为 null 时 command 就是完整 argv：必须自带 "python"，否则 exec "-m" 直接失败。
#     -> command 覆盖为 ["python","-m","dlp_http.server"]，从包根以模块方式启动（规格 D10，避开 sys.path[0] 陷阱）。
#   - presidio-analyzer 容器挂在网络 docker_default（bridge），本服务必须同网才能按服务名解析（规格 D9）。
#   - import dlp / DLPEngine / EngineConfig / InjectionPoint 已在容器内 import-OK。
services:
  dlp-http:
    image: kiro-dlp-engine:latest          # 复用现有镜像，零重建、零新依赖
    container_name: kiro-dlp-http
    restart: unless-stopped
    command: ["python", "-m", "dlp_http.server"]  # ENTRYPOINT=null，command 即完整 argv，必须自带 python
    environment:
      PYTHONPATH: /app                      # 规格 D10：显式指向引擎包根（镜像已内建，这里双保险）
      PRESIDIO_ANALYZER_URL: http://presidio-analyzer:5002/analyze   # L3 走容器内网服务名
      DLP_HTTP_BIND: 0.0.0.0                # 容器命名空间内 0.0.0.0；对外收敛靠 host 私网映射 + SG
      DLP_HTTP_PORT: "9000"
      DLP_SCAN_INJECTION_POINT: PROMPT      # 只在请求腿（prompt 出向）同步裁决
      DLP_MAX_BODY_BYTES: "16777216"        # 16 MiB
      DLP_ENGINE_POOL_SIZE: "4"             # 规格 D8：对象池并发上限，天然背压
      DLP_ENGINE_POOL_WAIT: "10.0"          # 池空最长等待秒，超则 503 -> addon fail-closed
      DLP_PRESIDIO_TIMEOUT_MS: "2000"       # L3 单次调用超时（引擎 EngineConfig.l3_timeout）
      DLP_PRESIDIO_LANGS: "en,zh"           # 与现有 presidio-analyzer-zh 对齐
      DLP_L3_UNAVAILABLE_ACTION: block      # 规格 D4：L3 不可达 -> 强制 BLOCK（fail-closed 打底）
      # ══════════════════════════════════════════════════════════════════════════
      # ⚠⚠⚠  L4 语义拦截 —— 本 compose 的【committed 演示/标定 shipped default】  ⚠⚠⚠
      # ══════════════════════════════════════════════════════════════════════════
      # 三态开关 DLP_L4_MODE ∈ {off, async, sync}：
      #   off   —— 同步腿只 L0–L3.5，完全不跑 L4，内容不出 VPC。
      #   async —— (本默认) 同步腿只 L0–L3.5、立即返回；后台异步跑 L4、命中落 sink，
      #            【绝不改 verdict】。保持 “L4 永不进入同步裁决” 铁律。
      #   sync  —— 显式阻断态：请求线程带墙钟等 L4；高置信(≥min_conf)→ 就地合成 BLOCK
      #            (top_layer=L4)；超时→降级为异步告警 + 按 L0–L3.5 放行(Q3-b)。
      #
      # ⚠ 本默认 DLP_USE_BEDROCK_L4=true：待判内容会【出 VPC】发往 Bedrock(us-west-2)。
      #   这是【知情的演示/标定 shipped default】，刻意违反仓库红线(生产 L4 须 VPC-local)。
      #   ★ 生产部署【必须】置 DLP_USE_BEDROCK_L4="false" 并切自托管 VPC-local(GPU+vLLM)。
      #   需容器内 boto3(镜像已含) + 宿主实例角色可 bedrock:InvokeModel/Converse
      #   (已实测 qwen.qwen3-32b-v1:0)。启动横幅会再次刺眼提示。
      # ──────────────────────────────────────────────────────────────────────────
      DLP_L4_MODE: "async"                  # off | async(默认) | sync
      DLP_USE_BEDROCK_L4: "true"            # ⚠ 内容出 VPC 至 Bedrock；生产必须置 false 切 VPC-local
      DLP_L4_MODEL_KEY: main                # main=Qwen3-32B / control=Llama-3.1-8B
      DLP_L4_BLOCK_MIN_CONFIDENCE: "0.7"    # sync 模式：L4 告警置信 >= 此值才合成 BLOCK
      DLP_L4_TIMEOUT_MS: "4000"             # sync 墙钟上限 + 透传 boto read_timeout；超时降级放行
      DLP_L4_EXECUTOR_WORKERS: "2"          # L4 后台线程池大小
      DLP_L4_QUEUE_MAX: "32"                # L4 背压上限（在跑+排队满则丢弃，绝不阻塞主链路）
      # DLP_L4_SINK_PATH: "/var/log/dlp-l4-alerts.jsonl"  # 可选：告警 JSONL 追加写此文件(默认仅 stdout)
      # 旧 flag 已弃用，由 DLP_L4_MODE 取代（仍兼容：未设 DLP_L4_MODE 时从下列推导 + warn）：
      #   DLP_RUN_ASYNC_L4 / DLP_L4_SYNC_BLOCK
      PYTHONUNBUFFERED: "1"
    volumes:
      # 把判定服务代码以只读方式挂进镜像的包根旁（dlp_http 与 dlp 同在 /app，命名空间包可 import）。
      - ./http_service/server.py:/app/dlp_http/server.py:ro
      # 引擎源码 bind-mount（覆盖镜像内旧版 dlp/，随改随生效、无需重建镜像）。
      - ./engine/dlp:/app/dlp:ro
    networks:
      - dlpnet
    ports:
      # ★ 绑私网 IP，绝不 0.0.0.0：EC2 公网是 IGW 1:1 NAT，本机接口只有私网 IP。
      #   同 VPC 的 proxy 节点经 172.31.27.174:9000 直达；SG 再收敛来源。
      - "172.31.27.174:9000:9000"
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:9000/health',timeout=2).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 8s

networks:
  dlpnet:
    external: true          # 规格 D9：引用已存在的外部网，与 presidio 同网
    name: docker_default    # 已 docker inspect 核实 presidio-analyzer 归属此网
