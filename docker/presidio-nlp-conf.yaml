# Presidio analyzer NLP 配置:en(官方自带 lg)+ zh(SPEC §5-L3 中文识别器)。
# 经 NLP_CONF_FILE 环境变量注入(presidio-analyzer app.py 支持)。
nlp_engine_name: spacy
models:
  - lang_code: en
    model_name: en_core_web_lg
  - lang_code: zh
    model_name: zh_core_web_sm
ner_model_configuration:
  model_to_presidio_entity_mapping:
    PER: PERSON
    PERSON: PERSON
    LOC: LOCATION
    GPE: LOCATION
    LOCATION: LOCATION
    ORG: ORGANIZATION
    NORP: NRP
    DATE: DATE_TIME
    TIME: DATE_TIME
  low_confidence_score_multiplier: 0.4
  low_score_entity_names:
    - ORGANIZATION
